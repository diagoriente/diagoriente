name: diagoriente
version: 0.0.0

# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - codex
  - claude

dependencies:
  apm:
    - microsoft/aspire-skills#e9725ad3acb28c01c77b4afba7ec87fbfaa7e21a
    - obra/superpowers#v6.3.0
  mcp:
    - name: "moon"
      registry: false
      transport: stdio
      command: "moon"
      args: ["mcp"]
      env:
        MOON_WORKSPACE_ROOT: .
    - name: "aspire"
      registry: false
      transport: stdio
      command: "aspire"
      args: ["agent", "mcp"]

includes: auto
scripts: {}
