name: CI (release)

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]+)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]+))*)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

  moon-ci:
    needs: validate-release-tag
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-moon-ci.yml
    secrets:
      buildfetch-token: ${{ secrets.BUILDFETCH_TOKEN }}

  docker-build:
    needs: moon-ci
    uses: ./.github/workflows/_reusable-docker-build.yml
    with:
      attestations: true
    permissions:
      contents: read
      packages: write
      id-token: write
