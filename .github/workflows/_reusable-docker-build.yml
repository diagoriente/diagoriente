name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      attestations:
        required: true
        type: boolean
    secrets:
      buildfetch-token:
        required: true

permissions: {}

jobs:
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_SCOPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'master' }}
      PARENT_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'master' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Add every tracked Dockerfile here before it can be built or published.
          - dockerfile: apps/api/Dockerfile
            name: api
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.name }}-master
            type=gha,scope=${{ matrix.name }}-${{ env.PARENT_CACHE_SCOPE }}
            type=gha,scope=${{ matrix.name }}-${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ env.CACHE_SCOPE }}
          secrets: |
            BUILDFETCH_TOKEN=${{ secrets.buildfetch-token }}
          provenance: ${{ inputs.attestations && 'mode=max' || false }}
          sbom: ${{ inputs.attestations }}
