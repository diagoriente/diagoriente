$schema: ./cache/schemas/workspace.json

projects: [".", "apps/*", "packages/*"]

vcs:
  defaultBranch: "master"
  provider: "github"
  hooks:
    pre-commit:
      - "moon run :lint"
    commit-msg:
      - "pnpm exec commitlint --edit $ARG1"

docker:
  scaffold:
    configsPhaseGlobs:
      - ".prototools"
      - "patches/**/*"

remote:
  host: grpcs://cache.eu-central-a.buildfetch.com
  auth:
    token: "BUILDFETCH_TOKEN"
  cache:
    instanceName: reapi/bazel/IxgUTK
    localReadOnly: true

telemetry: false
