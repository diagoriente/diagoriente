name = ".NET SDK"
type = "language"

[platform.linux]
archs = ["x86_64", "aarch64"]
download-file = "dotnet-sdk-{version}-linux{libc}-{arch}.tar.gz"
checksum-file = "dotnet-sdk-{version}-linux{libc}-{arch}.tar.gz.sha512"

[platform.linux.libc]
gnu = ""
musl = "-musl"

[platform.macos]
archs = ["x86_64", "aarch64"]
download-file = "dotnet-sdk-{version}-osx-{arch}.tar.gz"
checksum-file = "dotnet-sdk-{version}-osx-{arch}.tar.gz.sha512"

[platform.windows]
archs = ["x86_64", "aarch64"]
download-file = "dotnet-sdk-{version}-win-{arch}.zip"
checksum-file = "dotnet-sdk-{version}-win-{arch}.zip.sha512"

[install]
download-url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/{version}/{download_file}"
checksum-url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "x64"

[install.exes.dotnet]
exe-path = "dotnet"
primary = true

[resolve]
git-url = "https://github.com/dotnet/sdk"
version-pattern = "^v?(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)(?<pre>-[0-9A-Za-z.]+)?$"
